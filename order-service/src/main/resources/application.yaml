server:
  port: 7001
spring:
  application:
    name: order-service
  datasource:
    url: 'jdbc:mysql://localhost:3307/order_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
    username: root
    password: mysql
  jpa:
    hibernate:
      ddl-auto: none


inventory:
  service:
    url: http://localhost:7002

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

#Resilinece4j Properties
resilience4j:
  circuitbreaker:
    instances:
      inventory:
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
        waitDurationInOpenState: 5s
  #Resilience4J Timeout Properties
  timelimiter:
    instances:
      inventory:
        timeout-duration: 3s
  #Resilience4J Retry Properties
  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 2s
